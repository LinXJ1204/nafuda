# Run the Foundry test suite (TitleController T1–T8 against the pinned ENSv2 Beta sources).
name: contracts

on:
  push:
    branches: [main]
    paths: ['contracts/**', 'demo/**', '.github/workflows/contracts.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
