# Test and build the web app (consumer / and grader console /grader/), and check that the
# self-hosting image builds and serves both pages. Hosting: see docs/hosting.md.
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'deployments/sepolia.json', 'demo/**', 'hosting/**', '.dockerignore', '.github/workflows/web.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f hosting/Dockerfile -t nafuda-web .
      - name: Serve both pages
        run: |
          docker run -d -p 8080:80 --name web nafuda-web
          sleep 2
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/grader/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)" = 404
