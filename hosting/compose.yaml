# Self-hosting on the author's Mac mini: nginx with the static site, published to the internet
# through a Cloudflare Tunnel (no inbound ports opened on the home network).
#
#   cd hosting
#   docker compose up -d --build                    # web only, http://localhost:8088
#   docker compose --profile tunnel up -d --build   # web + its own tunnel (TUNNEL_TOKEN in hosting/.env)
#
# If the host already runs cloudflared, skip the tunnel profile and point a public hostname of
# that tunnel at http://localhost:8088. See docs/hosting.md.

name: nafuda

services:
  web:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
      args:
        VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL:-}
    image: nafuda-web
    ports:
      # Loopback only: the tunnel is the way in. WEB_PORT avoids clashing with other services.
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      # cloudflared reads the token from this variable, so it is not on the command line.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
