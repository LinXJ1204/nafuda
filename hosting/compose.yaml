# Self-hosting on the author's Mac mini: nginx with the static site, published to the internet
# through a Cloudflare Tunnel (no inbound ports opened on the home network).
#
#   cd hosting
#   docker compose up -d --build                    # web only, http://localhost:8088
#   docker compose --profile tunnel up -d --build   # web + its own tunnel (TUNNEL_TOKEN in hosting/.env)
#
# If the host already runs cloudflared, skip the tunnel profile and point a public hostname of
# that tunnel at http://localhost:8088. See docs/hosting.md.

name: nafuda

services:
  web:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
      args:
        VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL:-}
    image: nafuda-web
    ports:
      # Loopback only: the tunnel is the way in. WEB_PORT avoids clashing with other services.
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      # cloudflared reads the token from this variable, so it is not on the command line.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

  # v3 demo data: the market simulator (scripts/src/market.ts). Needs the demo keys in the repo's
  # root .env on the host (testnet only; never baked into an image). Runs until MARKET_UNTIL,
  # then exits; on-failure (not unless-stopped) so it does not restart after a normal stop.
  #   docker compose --profile market up -d market
  market:
    image: node:24-alpine
    profiles: [market]
    working_dir: /repo/scripts
    volumes:
      - ..:/repo
    env_file: ../.env
    command: >
      sh -c "npm ci --no-audit --no-fund --silent &&
             node src/market.ts --network sepolia --until $${MARKET_UNTIL} --budget $${MARKET_BUDGET:-0.3} --burst $${MARKET_BURST:-12}"
    environment:
      MARKET_UNTIL: ${MARKET_UNTIL:-2026-09-26T08:00:00+09:00}
    restart: on-failure

