# v3: collector app on :80 (nafuda.sololin.xyz), grader console on :81 (nafuda-grader.sololin.xyz).
# Both are single-page apps with clean URLs (fallback to index.html) and proxy /api to the api
# container. The upstream is resolved per request, so nginx starts even if api is not up yet.

map $uri $nafuda_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/collector;
    include /etc/nginx/conf.d/common.inc;
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/grader;
    include /etc/nginx/conf.d/common.inc;
}
