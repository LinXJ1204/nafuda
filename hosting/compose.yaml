# Self-hosting on the author's Mac mini: nginx with the static site, published to the internet
# through a Cloudflare Tunnel (no inbound ports opened on the home network).
#
#   cd hosting
#   docker compose up -d --build                    # apps + backend: http://localhost:8088 (collector), :8089 (grader)
#   docker compose --profile tunnel up -d --build   # web + its own tunnel (TUNNEL_TOKEN in hosting/.env)
#
# If the host already runs cloudflared, skip the tunnel profile and point a public hostname of
# that tunnel at http://localhost:8088. See docs/hosting.md.

name: nafuda

services:
  # v3 frontends: collector app (:8088 → nafuda.sololin.xyz) and grader console (:8089 → nafuda-grader.sololin.xyz)
  apps:
    build:
      context: ..
      dockerfile: hosting/apps.Dockerfile
    image: nafuda-apps
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
      - "127.0.0.1:${GRADER_PORT:-8089}:81"
    depends_on:
      - api
    restart: unless-stopped

  # v3 backend: Postgres (own container, no host port), the indexer and the read API.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nafuda
      POSTGRES_USER: nafuda
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nafuda-local-only}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nafuda"]
      interval: 5s
    restart: unless-stopped

  indexer:
    build:
      context: ..
      dockerfile: hosting/server.Dockerfile
    image: nafuda-server
    command: ["node", "src/main.ts", "indexer"]
    environment:
      DATABASE_URL: postgres://nafuda:${DB_PASSWORD:-nafuda-local-only}@db:5432/nafuda
      SEPOLIA_RPC_URL: ${INDEXER_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: nafuda-server
    command: ["node", "src/main.ts", "api"]
    environment:
      DATABASE_URL: postgres://nafuda:${DB_PASSWORD:-nafuda-local-only}@db:5432/nafuda
      SEPOLIA_RPC_URL: ${INDEXER_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      indexer:
        condition: service_started
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      # cloudflared reads the token from this variable, so it is not on the command line.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

  # v3 demo data: the market simulator (scripts/src/market.ts). Needs the demo keys in the repo's
  # root .env on the host (testnet only; never baked into an image). Runs until MARKET_UNTIL,
  # then exits; on-failure (not unless-stopped) so it does not restart after a normal stop.
  #   docker compose --profile market up -d market
  market:
    image: node:24-alpine
    profiles: [market]
    working_dir: /repo/scripts
    volumes:
      - ..:/repo
    env_file: ../.env
    command: >
      sh -c "npm ci --no-audit --no-fund --silent &&
             node src/market.ts --network sepolia --until $${MARKET_UNTIL} --budget $${MARKET_BUDGET:-0.3} --burst $${MARKET_BURST:-12}"
    environment:
      MARKET_UNTIL: ${MARKET_UNTIL:-2026-09-26T08:00:00+09:00}
    restart: on-failure

volumes:
  db:
