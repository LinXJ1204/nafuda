# Test and build the buyer-check web app. Hosting is Cloudflare Pages (Git integration),
# which builds and deploys from this repo on every push.
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'deployments/sepolia.json', 'demo/**', '.github/workflows/web.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
