# Self-hosting on the author's Mac mini: nginx with the static site, published to the internet
# through a Cloudflare Tunnel (no inbound ports opened on the home network).
#
#   cd hosting
#   docker compose up -d --build                    # web only, http://localhost:8080
#   docker compose --profile tunnel up -d --build   # web + tunnel (needs TUNNEL_TOKEN in hosting/.env)
#
# See docs/hosting.md.

services:
  web:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
      args:
        VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL:-}
    image: nafuda-web
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      # cloudflared reads the token from this variable, so it is not on the command line.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
