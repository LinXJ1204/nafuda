# Static hosting for web/dist. Both pages use hash routes, so no rewrites are needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative redirects (/grader → /grader/), so they keep the https host of the tunnel.
    absolute_redirect off;

    # Security headers (server level; the locations below use `expires`, not add_header, so
    # these are inherited everywhere).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # connect-src https: lets the browser reach the Sepolia RPC (public by default, or
    # VITE_SEPOLIA_RPC_URL). Wallet extensions are not affected by the page CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Vite's content-hashed assets never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /grader { return 301 /grader/; }

    # HTML: always revalidate, so a redeploy shows up immediately.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
